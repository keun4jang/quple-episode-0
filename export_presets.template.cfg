; 쿼플 안드로이드 export 프리셋 템플릿.
;
; export_presets.cfg 는 키스토어 비밀번호가 들어가므로 .gitignore 에 있다.
; 이 템플릿에서 tools/build-android.sh 가 실제 export_presets.cfg 를 만들어 준다.
; __KEYSTORE__ / __KEYSTORE_USER__ / __KEYSTORE_PASS__ 자리는 스크립트가 채운다.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, assets/mascots/3d/*, assets/mascots/*.glb, assets/mascots/*.svg, assets/mascots/*.webp, assets/mascots/*.json, assets/mascots/quika-*.png, assets/mascots/quica-couple*.png, assets/mascots/quica-leader*.png, assets/mascots/quica-partner*.png, assets/mascots/quica-face-closeup.png, assets/mascots/quica-contact-sheet.png, assets/mascots/quica-thumbnail-test.png, assets/mascots/quica-hero-diorama-preview-*.png, assets/splash/candidates/*, assets/splash/source/*, assets/splash/*.webp, assets/splash/*.svg, assets/splash/*.json, assets/fonts/BlackHanSans.ttf, assets/icon/icon-64.png, assets/icon/icon-128.png, assets/icon/icon-256.png"
export_path="build/quple.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
version/code=1
version/name="0.1.0"
package/unique_name="com.quple.episode0"
package/name="쿼플"
keystore/release="__KEYSTORE__"
keystore/release_user="__KEYSTORE_USER__"
keystore/release_password="__KEYSTORE_PASS__"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
